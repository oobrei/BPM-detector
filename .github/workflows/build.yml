name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x86
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
          # linux-x86 is not buildable: .NET 10 ships no linux-x86 apphost (NETSDK1084) and
          # Avalonia/SkiaSharp have no 32-bit Linux native assets, so a produced binary could not
          # render a window.
          - os: ubuntu-latest
            rid: linux-arm64

    runs-on: ${{ matrix.os }}
    name: publish ${{ matrix.rid }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish src/Bpm.App/Bpm.App.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -o out/${{ matrix.rid }}

      # No manual zip here: upload-artifact already wraps the folder in a zip when downloaded,
      # so zipping first produced a zip inside a zip.
      - uses: actions/upload-artifact@v4
        with:
          name: bpm-detector-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/
          if-no-files-found: error

  release:
    name: create release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Each artifact lands in its own folder: out/bpm-detector-<rid>/...
      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Package
        shell: bash
        run: |
          cd out
          for d in */; do
            zip -r -j "${d%/}.zip" "$d"
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: BPM Detector ${{ github.ref_name }}
          files: out/*.zip
          generate_release_notes: true